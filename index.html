<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131f"><title>Nova AI — مساعدك الذكي</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131a2c;--line:#27314a;--text:#eef2ff;--muted:#9ba8c7;--accent:#7c8cff;--accent2:#5ce1c6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2442 0,#0b1020 48%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:16px}header{display:flex;align-items:center;gap:12px;padding:12px 4px 20px;border-bottom:1px solid var(--line)}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#08101c;font-weight:900;font-size:22px}h1{font-size:20px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:13px}#status{margin-right:auto;font-size:12px;color:var(--muted)}#status:before{content:"● ";color:#f5bf55}.welcome{padding:34px 8px 22px;text-align:center}.welcome h2{font-size:clamp(25px,5vw,38px);margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.8}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.chip{background:#19223a;color:#dbe3ff;border:1px solid #303c5d;border-radius:999px;padding:9px 13px;cursor:pointer}#messages{display:flex;flex-direction:column;gap:14px;padding:10px 0 20px;flex:1}.msg{max-width:88%;white-space:pre-wrap;line-height:1.7;padding:13px 15px;border-radius:18px;border:1px solid var(--line);overflow-wrap:anywhere}.user{align-self:flex-start;background:#29335a;border-bottom-right-radius:5px}.assistant{align-self:flex-end;background:var(--panel);border-bottom-left-radius:5px}.error{color:#ffd5d5;border-color:#79414c}form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:18px 0 8px}.composer{display:flex;gap:9px;background:#151d31;border:1px solid #34405e;border-radius:20px;padding:8px}textarea{resize:none;flex:1;min-height:46px;max-height:160px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px}.send{border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07101a;font-weight:800;padding:0 18px;cursor:pointer}.send:disabled{opacity:.5}.note{color:var(--muted);font-size:11px;text-align:center;margin:8px 0 0}@media(max-width:560px){.app{padding:10px}.msg{max-width:95%}.welcome{padding-top:25px}.send{padding:0 13px}}
</style></head><body><div class="app"><header><div class="logo">N</div><div><h1>Nova AI</h1><p>مساعدك الذكي بالعربية</p></div><div id="status">خاص الإعداد</div></header>
<section class="welcome" id="welcome"><h2>كيف نقدر نعاونك اليوم؟</h2><p>اسول، تعلّم، اكتب أو خطّط. خاص ربط الخادم بمفتاح API باش تتفعّل الإجابات الذكية.</p><div class="chips"><button class="chip" data-prompt="شرح لي الذكاء الاصطناعي بطريقة سهلة">شرح موضوع</button><button class="chip" data-prompt="عاونّي نكتب قصة مشوقة قصيرة">كتابة قصة</button><button class="chip" data-prompt="علّمني HTML خطوة بخطوة">تعلّم البرمجة</button></div></section><main id="messages" aria-live="polite"></main>
<form id="chat-form"><div class="composer"><textarea id="prompt" placeholder="اكتب رسالتك هنا..." rows="1" aria-label="رسالتك"></textarea><button class="send" id="send" type="submit">إرسال</button></div><p class="note">لا تضع مفتاح API هنا. خزّنه بأمان في إعدادات الاستضافة.</p></form></div>
<script>
const form=document.getElementById('chat-form'),box=document.getElementById('prompt'),messages=document.getElementById('messages'),send=document.getElementById('send'),statusEl=document.getElementById('status'),welcome=document.getElementById('welcome');let history=[];
function add(role,text){const e=document.createElement('div');e.className='msg '+role;e.textContent=text;messages.appendChild(e);e.scrollIntoView({behavior:'smooth',block:'end'});return e}
async function sendMessage(text){text=text.trim();if(!text||send.disabled)return;welcome.style.display='none';add('user',text);history.push({role:'user',content:text});box.value='';send.disabled=true;send.textContent='...';const reply=add('assistant','Nova AI كيجاوبك دابا...');try{const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تأكد من إعدادات Netlify ومفتاح API.');reply.textContent=d.reply||'ما توصلتش بجواب.';history.push({role:'assistant',content:reply.textContent});statusEl.textContent='متصل'}catch(e){reply.textContent='ما قدرش يتوصل بالخادم: '+e.message;reply.classList.add('error');history.pop();statusEl.textContent='خاص الإعداد'}finally{send.disabled=false;send.textContent='إرسال';box.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(box.value)});box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));
</script></body></html>
